name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-check-test:
    name: Engine regression
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Hydrate the engine regression fixture
        run: npm run hydrate:test-model-data

      - name: Build
        run: npm run build:offline

      - name: Check
        run: npm run check

      - name: Build the pi-env daemon
        run: npm run build:daemon --workspace packages/env

      - name: Test
        run: ./test.sh

  current-model-catalog:
    name: Current model catalog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Discover current models
        run: npm run generate:model-catalog

      - name: Validate the discovered catalog bundle
        run: npm run check:model-catalog

      - name: Report model additions, removals, and metadata changes
        run: node scripts/report-model-catalog.mjs packages/ai/test/fixtures/model-catalog.json .artifacts/model-catalog/models.all.json .artifacts/current-catalog-report

      - name: Hydrate current model data
        run: node packages/ai/scripts/hydrate-model-catalog.ts .artifacts/model-catalog/models.all.json

      - name: Build against current models
        run: npm run build:offline

      - name: Check current providers and selected runtime defaults
        working-directory: packages/ai
        run: node "$GITHUB_WORKSPACE/node_modules/vitest/dist/cli.js" --run test/current-model-catalog.test.ts

      - name: Retain the discovered catalog and change report
        if: ${{ always() && hashFiles('.artifacts/model-catalog/**', '.artifacts/current-catalog-report/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-model-catalog
          path: |
            .artifacts/model-catalog
            .artifacts/current-catalog-report
          if-no-files-found: error
          retention-days: 14

  mcp-conformance:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runs pi's MCP client from source against the pinned official conformance suite and fails on
      # regressions against packages/coding-agent/test/mcp-conformance/baseline.json.
      - name: MCP client conformance
        run: npm run test:mcp-conformance
